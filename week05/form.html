<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - WDD 131</title>
    <meta name="description" content="Product Review Form for WDD 131 assignment">
    <meta name="author" content="Gabriel Mercês Silva">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <main>
        <h1>Product Review</h1>
        <form method="get" action="review.html">
            <fieldset>
                <!-- Product Name -->
                <label for="productName" class="required">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <!-- Overall Rating -->
                <label class="required">Overall Rating</label>
                <div class="rating-group">
                    <label>
                        <input type="radio" id="star1" name="rating" value="1" required> ☆
                    </label>
                    <label>
                        <input type="radio" id="star2" name="rating" value="2"> ☆☆
                    </label>
                    <label>
                        <input type="radio" id="star3" name="rating" value="3"> ☆☆☆
                    </label>
                    <label>
                        <input type="radio" id="star4" name="rating" value="4"> ☆☆☆☆
                    </label>
                    <label>
                        <input type="radio" id="star5" name="rating" value="5"> ☆☆☆☆☆
                    </label>
                </div>

                <!-- Date of Installation -->
                <label for="installDate" class="required">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>

                <!-- Useful Features -->
                <label>Which features did you find useful? <span>(Check all that apply)</span></label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="feat-durability" name="features" value="durability"> Durability
                    </label>
                    <label>
                        <input type="checkbox" id="feat-ease" name="features" value="easeOfUse"> Ease of Use
                    </label>
                    <label>
                        <input type="checkbox" id="feat-perf" name="features" value="performance"> Performance
                    </label>
                    <label>
                        <input type="checkbox" id="feat-design" name="features" value="design"> Design
                    </label>
                </div>

                <!-- Written Review -->
                <label for="reviewText">Written Review <span>(Optional)</span></label>
                <textarea id="reviewText" name="reviewText"></textarea>

                <!-- User Name -->
                <label for="userName">Your Name <span>(Optional)</span></label>
                <input type="text" id="userName" name="userName">

                <!-- Submit Button -->
                <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>
    <footer>
        <p>©<span id="currentYear"></span> Gabriel Mercês Silva - Bahia, BR</p>
        <p id="lastModified"></p>
    </footer>
    <script src="../scripts/getdates.js"></script>
</body>

</html>
